# esp-wifi-agent configuration
#
# The ESP32 mobile unit is tethered to the host over USB-C (power + serial
# console through the on-board USB-UART bridge). It creates a softAP
# ("3bbo_Ext") when it detects weak coverage; this daemon reacts by
# connecting to that AP, and falls back to the previous network when the
# AP goes away.
#
# The daemon also PROVISIONS the mobile node: whenever the host's current
# Wi-Fi changes (or the ESP32 reboots), it pushes the SSID + password over
# the same USB link so the extender joins whatever network the handheld is
# on - no credentials baked into firmware. Reading the password requires
# NM secret access, which is why esp-wifi-agent.service runs as root.
#
# Every value has a sane default and can be overridden with the matching
# ESP_WIFI_AGENT_* environment variable (see README).

[esp32]
# SSID created by the ESP32 mobile unit in repeater/AP mode
ext_ssid = 3bbo_Ext
ext_psk = YOUR_EXTENDER_PASSWORD

[wifi]
iface = wlan0

[daemon]
# seconds between NetworkManager scan requests
scan_interval_sec = 5
# hysteresis: ticks the AP must be seen/missed before switching
req_seen = 2
req_missed = 2
state_file = /var/lib/esp-wifi-agent/previous.txt

[usb]
# USB-C tether: /dev/ttyUSB0 for classic boards with a USB-UART bridge,
# /dev/ttyACM0 for native-USB parts (ESP32-S3/C3)
serial_device = /dev/ttyUSB0
serial_baud = 115200
telemetry = true
command = true

[kernel]
# optional: mirror state into the espnet kernel driver
publish_device = /dev/espnet