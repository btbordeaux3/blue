# dkms.conf - Dynamic Kernel Module Support packaging so the modules are
# rebuilt automatically across kernel updates:
#   sudo dkms install kmod/   (DKMS >= 3.1 accepts a source dir)
# or add a /usr/src/espnet-0.1 symlink and run `dkms add`.

PACKAGE_NAME="espnet"
PACKAGE_VERSION="0.1"

BUILT_MODULE_NAME[0]="espnet_core"
BUILT_MODULE_NAME[1]="espnet_usb"
BUILT_MODULE_NAME[2]="espnet_vbus"
DEST_MODULE_LOCATION[0]="/kernel/drivers/misc/"
DEST_MODULE_LOCATION[1]="/kernel/drivers/usb/misc/"
DEST_MODULE_LOCATION[2]="/kernel/drivers/misc/"

MAKE="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

AUTOINSTALL="yes"
REMAKE_INITRD="yes"