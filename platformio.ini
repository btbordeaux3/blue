; Blue - Adaptive WiFi Repeater System
; Build: pio run -e base   (for the stationary base station)
; Build: pio run -e mobile  (for the battery-powered mobile unit)
; Build: pio run -e mobile-safe (inert parking firmware; never uploads automatically)

[platformio]
default_envs = base
src_dir = src
include_dir = include

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:base]
extends = common
board = esp32-s3-devkitc-1
build_flags =
    -DDEVICE_BASE=1
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DAPI_URL=\"https://rf-map-api.housemapper.workers.dev\"
src_filter = +<../include/> +<shared/> +<base/>

[env:base-wroom]
extends = common
board = esp32dev
build_flags =
    -DDEVICE_BASE=1
    -DCORE_DEBUG_LEVEL=3
    -DAPI_URL=\"https://rf-map-api.housemapper.workers.dev\"
src_filter = +<../include/> +<shared/> +<base/>

[env:mobile]
extends = common
build_flags =
    -DDEVICE_MOBILE=1
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DENABLE_USB_LINK=1
src_filter = +<../include/> +<shared/> +<mobile/>
[env:mobile-safe]
extends = common
build_flags =
    -DDEVICE_MOBILE=1
    -DCORE_DEBUG_LEVEL=0
src_filter = +<mobile-safe/>
