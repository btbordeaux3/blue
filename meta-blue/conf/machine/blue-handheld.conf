# Reference machine definition for the product SoC: the "handheld" that
# runs the esp-wifi-agent and is tethered to an ESP32 over USB-C.
#
# Based on an ARMv8-A (Cortex-A53) so it can also run under QEMU for
# bring-up CI. Swap in a real vendor SoC BSP by pointing MACHINE at your
# vendor's layer and adjusting KERNEL_DEVICETREE/IMAGE_FSTYPES.

require conf/machine/include/arm/armv8a/tune-cortexa53.inc

MACHINE_HWCODECS = ""

MACHINE_FEATURES = "apm-wakeup bluetooth ext2 ext3 keyboard usbhost vfat usbgadget screen wifi"

KERNEL_IMAGETYPE = "Image"
KERNEL_IMAGETYPE:append = " Image.gz"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"

# Ship the VBUS power rail overlay in the kernel's device tree (see
# recipes-kernel/linux/*.bbappend)
KERNEL_DEVICETREE += "blue-vbus.dtbo"

SERIAL_CONSOLES = "115200;ttyAMA0 115200;ttyS0"

IMAGE_FSTYPES += "ext4 tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "81920"

# The agent talks to NetworkManager over D-Bus - required at runtime
IMAGE_INSTALL:append = " networkmanager systemd"